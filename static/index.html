<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Analog Matcher — Luna/Marte ⇄ Tierra</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --surface:rgba(255,255,255,0.72); --surface-solid:#ffffff; --page:#f9f9f7;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --accent:#2a78d6; --aqua:#1baf7a;
    --good:#0ca30c; --warn:#d98a00; --serious:#ec835a; --critical:#d03b3b;
    --hair:rgba(11,11,11,0.10); --ring:rgba(11,11,11,0.06); --grid:#e1e0d9;
    --moonbg:#9b9a95; --marsbg:#b45a3c; --earthbg:#2f6f66;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface:rgba(32,32,30,0.66); --surface-solid:#1c1c1a; --page:#0d0d0d;
      --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
      --accent:#3987e5; --aqua:#199e70;
      --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#e66767;
      --hair:rgba(255,255,255,0.10); --ring:rgba(255,255,255,0.06); --grid:#2c2c2a;
      --moonbg:#4a4a47; --marsbg:#6e3324; --earthbg:#1d3f3a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);
    color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

  header.bar{position:sticky;top:0;z-index:1000;background:var(--surface);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--hair)}
  .bar-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;max-width:1240px;margin:0 auto}
  .brand{font-weight:670;letter-spacing:-0.02em;font-size:17px;display:flex;align-items:center;gap:9px}
  .brand .dot{width:11px;height:11px;border-radius:50%;
    background:conic-gradient(from 0deg,#9b9a95,#2f6f66,#b45a3c,#9b9a95)}
  .brand .sub{color:var(--muted);font-weight:400;font-size:12.5px;letter-spacing:0}
  .spacer{flex:1}
  .ctl{display:flex;align-items:center;gap:8px}
  .ctl label{color:var(--muted);font-size:12px;font-weight:540}

  .seg{display:inline-flex;background:var(--ring);border-radius:11px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12.5px;
    font-weight:560;padding:6px 12px;border-radius:9px;cursor:pointer;transition:transform .1s ease}
  .seg button:active{transform:scale(.96)}
  .seg button[aria-pressed="true"]{background:var(--surface-solid);color:var(--ink);box-shadow:var(--shadow)}

  .panels{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair)}
  @media(max-width:820px){.panels{grid-template-columns:1fr}}
  .panel{background:var(--surface-solid);position:relative}
  .panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 14px;border-bottom:1px solid var(--hair)}
  .panel .ph .t{font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px}
  .panel .ph .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--hair)}
  .chip{border:1px solid var(--hair);background:var(--surface-solid);color:var(--ink);font:inherit;
    font-size:12px;font-weight:540;padding:5px 11px;border-radius:999px;cursor:pointer;
    transition:transform .1s ease,border-color .15s,box-shadow .15s}
  .chip:active{transform:scale(.95)}
  .chip[aria-pressed="true"]{border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .map{height:360px;width:100%}
  #srcMap{background:var(--moonbg)} #srcMap.mars{background:var(--marsbg)}
  #earthMap{background:var(--earthbg)}
  .leaflet-container{font-family:inherit}

  .results{max-width:1240px;margin:0 auto;padding:20px}
  .overall{background:var(--surface-solid);border:1px solid var(--hair);border-radius:18px;
    padding:18px 22px;margin-bottom:16px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;box-shadow:var(--shadow)}
  .overall .big{font-size:clamp(38px,6vw,52px);font-weight:680;letter-spacing:-0.03em;line-height:1;
    font-variant-numeric:tabular-nums}
  .overall .meta{flex:1;min-width:220px}
  .overall .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .overall .loc{font-size:20px;font-weight:620;letter-spacing:-0.02em;margin-top:2px}
  .overall .desc{color:var(--ink2);font-size:13px;margin-top:3px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px}
  .card{background:var(--surface-solid);border:1px solid var(--hair);border-radius:15px;
    padding:14px 16px;box-shadow:var(--shadow);transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s}
  .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.06),0 14px 32px rgba(0,0,0,.12)}
  .card .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .card .ic{font-size:16px;line-height:1}
  .card .nm{font-weight:600;font-size:13.5px;letter-spacing:-0.01em;flex:1}
  .verdict{font-size:11px;font-weight:650;padding:2px 9px;border-radius:999px;display:inline-flex;
    align-items:center;gap:6px;border:1px solid var(--hair)}
  .verdict .vd{width:7px;height:7px;border-radius:50%}
  .bar{height:7px;background:var(--ring);border-radius:999px;overflow:hidden;margin:4px 0 12px}
  .bar>i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.22,1,.36,1)}
  .rows{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .rows div{display:flex;justify-content:space-between;padding:2px 0;gap:10px}
  .rows .k{color:var(--muted)}
  .rows .site{color:var(--ink);font-weight:580;text-align:right}
  .pct{font-weight:660;font-variant-numeric:tabular-nums}

  .caveats{margin-top:20px;background:var(--surface-solid);border:1px solid var(--hair);
    border-left:3px solid var(--serious);border-radius:12px;padding:13px 17px;font-size:12.5px;color:var(--ink2);box-shadow:var(--shadow)}
  .caveats b{color:var(--ink)} .caveats ul{margin:6px 0 0;padding-left:18px}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:22px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useRef,useMemo} = React;

/* =========================================================================
   SEIS DIMENSIONES — unidad real + TOLERANCIA física (cuánta diferencia
   absoluta cuenta como "bastante distinto"). Cercanía con valores ABSOLUTOS:
       cercania = exp( -(|a-b| / tolerancia)^2 )   -> 0..1
   ========================================================================= */
const DIMS = [
  {key:"terrain",     name:"Terreno / pendiente",  ic:"⛰️", unit:"°",     tol:12,  color:"#2a78d6", min:0,  max:35},
  {key:"roughness",   name:"Rugosidad",            ic:"🪨", unit:"m",     tol:120, color:"#1baf7a", min:20, max:600},
  {key:"composition", name:"Composición (FeO)",    ic:"🧪", unit:"% FeO", tol:6,   color:"#eda100", min:4,  max:18},
  {key:"craters",     name:"Densidad de cráteres", ic:"🌑", unit:"/Mkm²", tol:40,  color:"#e87ba4", min:2,  max:160},
  {key:"illum",       name:"Iluminación (incid.)", ic:"☀️", unit:"°",     tol:18,  color:"#6250d6", min:5,  max:88},
  {key:"caves",       name:"Cuevas / tubos lava",  ic:"🕳️", unit:"idx",   tol:0.3, color:"#eb6834", min:0,  max:1},
];
const DKEYS = DIMS.map(d=>d.key);

const PROFILES = {
  "Balanceado":   {},
  "Rover":        {terrain:3, roughness:2.5, craters:1.5},
  "Térmico":      {illum:3, composition:1.5},
  "Hábitat/cuevas":{caves:3.5, roughness:1.5},
};

/* Candidatos de la Tierra (en la versión real = todas las celdas del DEM).
   vals = [pendiente°, rugosidad m, FeO %, cráteres /Mkm², iluminación° incid, cuevas idx] */
const EARTH = [
  {name:"Harrat Khaybar, Arabia S.", lat:25.0, lon:39.9,  vals:[6,90,12,10,25,0.60]},
  {name:"Lanzarote, Canarias",       lat:29.0, lon:-13.6, vals:[9,120,11,8,29,0.90]},
  {name:"Lava Beds, California",     lat:41.7, lon:-121.5,vals:[11,140,10,6,42,0.88]},
  {name:"Cráter Lonar, India",       lat:19.9, lon:76.5,  vals:[14,180,11,120,20,0.15]},
  {name:"Isla Axel Heiberg, Canadá", lat:79.4, lon:-90.8, vals:[16,300,6,4,79,0.10]},
  {name:"Svalbard, Noruega",         lat:78.2, lon:15.6,  vals:[15,260,6,4,78,0.12]},
  {name:"Cuenca de Qaidam, China",   lat:37.0, lon:95.0,  vals:[5,160,7,6,37,0.08]},
  {name:"Desierto del Namib",        lat:-24.7,lon:15.3,  vals:[4,90,8,4,25,0.05]},
  {name:"Emi Koussi, Chad",          lat:19.8, lon:18.5,  vals:[20,420,12,10,20,0.30]},
  {name:"Cañón Fish River, Namibia", lat:-27.6,lon:17.6,  vals:[26,520,7,3,28,0.20]},
  {name:"Campo del Teide, Canarias", lat:28.3, lon:-16.6, vals:[18,380,11,6,28,0.55]},
  {name:"Meseta de Putorana, Rusia", lat:69.0, lon:94.0,  vals:[22,360,11,5,69,0.25]},
  {name:"Isla Devon, Canadá",        lat:75.4, lon:-89.8, vals:[17,300,6,60,75,0.12]},
  {name:"Barreal, Argentina",        lat:-31.6,lon:-69.4, vals:[3,80,7,5,32,0.05]},
  {name:"Galápagos (tubos de lava)", lat:-0.6, lon:-90.4, vals:[9,120,12,5,15,0.85]},
];

/* Puntos famosos (atajos). El motor igual acepta CUALQUIER punto que clickees. */
const FAMOUS = {
  moon:[
    {n:"Apollo 11",     lat:0.67,  lon:23.47, vals:[3,60,16,30,20,0.20]},
    {n:"Shackleton",    lat:-89.9, lon:0.0,   vals:[20,300,6,20,88,0.10]},
    {n:"Tycho",         lat:-43.3, lon:-11.4, vals:[28,520,10,120,45,0.15]},
    {n:"Apollo 17",     lat:20.19, lon:30.77, vals:[10,180,15,40,25,0.30]},
    {n:"Mons Mouton",   lat:-84.6, lon:-38.5, vals:[8,160,7,15,84,0.08]},
    {n:"Aristarchus",   lat:23.7,  lon:-47.4, vals:[16,300,13,25,25,0.85]},
  ],
  mars:[
    {n:"Jezero",        lat:18.44, lon:77.45, vals:[7,160,14,40,20,0.10]},
    {n:"Gale",          lat:-5.4,  lon:137.8, vals:[12,400,13,45,10,0.10]},
    {n:"Olympus Mons",  lat:18.65, lon:-133.8,vals:[9,300,12,10,18,0.35]},
    {n:"Valles Marineris",lat:-13.9,lon:-59.2,vals:[26,520,13,12,16,0.25]},
    {n:"Gusev",         lat:-14.6, lon:175.5, vals:[8,220,14,50,16,0.10]},
    {n:"Elysium",       lat:4.5,   lon:135.9, vals:[6,180,12,20,8,0.30]},
  ],
};

const TILES = {
  moon:"https://cartocdn-gusc.global.ssl.fastly.net/opmbuilder/api/v1/map/named/opm-moon-basemap-v0-1/all/{z}/{x}/{y}.png",
  mars:"https://cartocdn-gusc.global.ssl.fastly.net/opmbuilder/api/v1/map/named/opm-mars-basemap-v0-2/all/{z}/{x}/{y}.png",
};

const CAVEATS = [
  "la gravedad reducida de la Luna (1/6 g) ni la de Marte (3/8 g)",
  "el vacío lunar ni la atmósfera delgada marciana (~0,6% de la terrestre)",
  "el ambiente de radiación sin una magnetosfera que proteja",
];

/* ---- RNG determinístico: mismo punto => misma huella (demo estable) ---- */
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* Huella de un punto CUALQUIERA, generada de sus coords (hasta tener el DEM real).
   La iluminación se sesga con |lat|: cerca de los polos el sol pega más rasante. */
function fingerprintOf(lat,lon){
  const r=mulberry(Math.floor(Math.abs(lat*1000+lon*17)*131)%2**31);
  const v={};
  DIMS.forEach(d=>{ v[d.key]=d.min+r()*(d.max-d.min); });
  v.illum=clamp(Math.abs(lat)*(0.7+0.5*r()),5,88);
  v.caves=r()*r();           // sesgado hacia valores bajos
  return DKEYS.map(k=>v[k]);
}

/* ---- MOTOR DE CERCANÍA (idéntico al que irá en FastAPI) ----------------- */
function closeness(a,b,tol){const z=(a-b)/tol;return Math.exp(-z*z);}
function matchPoint(vals,weights){
  const scored=EARTH.map(e=>{
    const dims={};let ws=0,acc=0;
    DIMS.forEach((d,i)=>{
      const c=closeness(vals[i],e.vals[i],d.tol); dims[d.key]=c;
      const w=weights[d.key]??1; ws+=w; acc+=w*c;
    });
    return {site:e,dims,overall:acc/ws};
  });
  const overall=[...scored].sort((a,b)=>b.overall-a.overall)[0];
  const perDim={};
  DIMS.forEach((d,i)=>{
    const best=[...scored].sort((a,b)=>b.dims[d.key]-a.dims[d.key])[0];
    perDim[d.key]={site:best.site,score:best.dims[d.key],
      src:vals[i],match:best.site.vals[i],diff:Math.abs(vals[i]-best.site.vals[i])};
  });
  return {overall,perDim};
}
/* >>> BACKEND REAL: reemplazar matchPoint/fingerprintOf por:
   const r=await fetch('/api/match',{method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({source_body:body,lat,lon,target_body:'earth',weights})}); return r.json();
   La forma del objeto ya es la que consume el render. */

function verdict(c){
  if(c>=0.72) return {t:"Fuerte",   c:"var(--good)"};
  if(c>=0.48) return {t:"Moderado", c:"var(--warn)"};
  if(c>=0.28) return {t:"Débil",    c:"var(--serious)"};
  return             {t:"Se rompe", c:"var(--critical)"};
}
function fmt(v,k){return k==="caves"?v.toFixed(2):v.toFixed(v<10?1:0);}

function Seg({value,options,onChange}){
  return <div className="seg" role="group">
    {options.map(o=><button key={o} aria-pressed={value===o} onClick={()=>onChange(o)}>{o}</button>)}
  </div>;
}

function App(){
  const [body,setBody]=useState("moon");
  const [profile,setProfile]=useState("Balanceado");
  const [pt,setPt]=useState({lat:FAMOUS.moon[0].lat,lon:FAMOUS.moon[0].lon,name:"Apollo 11",vals:FAMOUS.moon[0].vals});
  const [hover,setHover]=useState(null);

  const weights=useMemo(()=>{const b={};DKEYS.forEach(k=>b[k]=1);return Object.assign(b,PROFILES[profile]||{});},[profile]);
  const res=useMemo(()=>matchPoint(pt.vals,weights),[pt,weights]);

  // refs Leaflet
  const srcMapEl=useRef(),earthMapEl=useRef();
  const srcMap=useRef(),earthMap=useRef(),bodyTile=useRef(),srcMk=useRef(),earthLayer=useRef();
  const earthMks=useRef({});

  // init una vez
  useEffect(()=>{
    if(typeof L==="undefined")return;
    srcMap.current=L.map(srcMapEl.current,{worldCopyJump:true,zoomControl:true}).setView([0,0],1);
    srcMap.current.on("click",e=>pickFree(e.latlng.lat,e.latlng.lng));
    earthMap.current=L.map(earthMapEl.current,{worldCopyJump:true}).setView([20,0],1);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:7}).addTo(earthMap.current);
    earthLayer.current=L.layerGroup().addTo(earthMap.current);
    return ()=>{srcMap.current&&srcMap.current.remove();earthMap.current&&earthMap.current.remove();};
  },[]);

  // tiles del cuerpo origen
  useEffect(()=>{
    if(!srcMap.current)return;
    if(bodyTile.current)srcMap.current.removeLayer(bodyTile.current);
    bodyTile.current=L.tileLayer(TILES[body],{attribution:"OpenPlanetaryMap",maxZoom:6}).addTo(srcMap.current);
    srcMapEl.current.classList.toggle("mars",body==="mars");
  },[body]);

  // marcador del punto origen
  useEffect(()=>{
    if(!srcMap.current)return;
    if(srcMk.current)srcMap.current.removeLayer(srcMk.current);
    srcMk.current=L.circleMarker([pt.lat,pt.lon],{radius:7,color:"#fff",weight:2,
      fillColor:body==="moon"?"#2a78d6":"#eb6834",fillOpacity:1}).addTo(srcMap.current);
  },[pt,body]);

  // marcadores Tierra (global + por dimensión)
  useEffect(()=>{
    if(!earthLayer.current)return;
    earthLayer.current.clearLayers(); earthMks.current={};
    const o=res.overall.site;
    L.circleMarker([o.lat,o.lon],{radius:9,color:"#fff",weight:2,fillColor:"#2a78d6",fillOpacity:.95})
      .bindTooltip("Global · "+o.name,{direction:"top"}).addTo(earthLayer.current);
    DIMS.forEach(d=>{
      const s=res.perDim[d.key].site;
      const m=L.circleMarker([s.lat,s.lon],{radius:5,color:"#fff",weight:1.5,fillColor:d.color,fillOpacity:.9})
        .bindTooltip(d.name+" · "+s.name,{direction:"top"}).addTo(earthLayer.current);
      earthMks.current[d.key]=m;
    });
  },[res]);

  // hover en una card -> resalta su marcador
  useEffect(()=>{
    Object.entries(earthMks.current).forEach(([k,m])=>{
      if(!m)return;
      if(k===hover){m.setStyle({radius:9,weight:2.5});m.openTooltip();}
      else{m.setStyle({radius:5,weight:1.5});m.closeTooltip();}
    });
  },[hover]);

  function pickFree(lat,lon){
    setPt({lat,lon,name:`${lat.toFixed(2)}, ${lon.toFixed(2)}`,vals:fingerprintOf(lat,lon)});
  }
  function pickFamous(f){
    if(srcMap.current)srcMap.current.flyTo([f.lat,f.lon],3,{duration:.6});
    setPt({lat:f.lat,lon:f.lon,name:f.n,vals:f.vals});
  }
  useEffect(()=>{pickFamous(FAMOUS[body][0]);},[body]); // al cambiar de cuerpo

  const ov=verdict(res.overall.overall);
  return (
    <div>
      <header className="bar"><div className="bar-in">
        <div className="brand"><span className="dot"></span>Analog Matcher
          <span className="sub">· Luna/Marte ⇄ Tierra</span></div>
        <div className="spacer"></div>
        <div className="ctl"><label>Origen</label>
          <Seg value={body==="moon"?"Luna":"Marte"} options={["Luna","Marte"]}
               onChange={v=>setBody(v==="Luna"?"moon":"mars")}/></div>
        <div className="ctl"><label>Perfil</label>
          <Seg value={profile} options={Object.keys(PROFILES)} onChange={setProfile}/></div>
      </div></header>

      <div className="panels">
        <div className="panel">
          <div className="ph">
            <span className="t">{body==="moon"?"🌙 Luna":"🔴 Marte"} · origen</span>
            <span className="c">{pt.name}</span>
          </div>
          <div className="chips">
            {FAMOUS[body].map(f=>(
              <button key={f.n} className="chip" aria-pressed={pt.name===f.n} onClick={()=>pickFamous(f)}>{f.n}</button>
            ))}
          </div>
          <div id="srcMap" ref={srcMapEl} className="map"></div>
        </div>
        <div className="panel">
          <div className="ph">
            <span className="t">🌍 Tierra · análogos</span>
            <span className="c">● global&nbsp;&nbsp;● por dimensión</span>
          </div>
          <div style={{padding:"9px 14px",borderBottom:"1px solid var(--hair)",fontSize:12,color:"var(--muted)"}}>
            Clic en el mapa de origen para probar cualquier punto.
          </div>
          <div id="earthMap" ref={earthMapEl} className="map" style={{height:"calc(360px + 39px)"}}></div>
        </div>
      </div>

      <div className="results">
        <div className="overall">
          <div className="big" style={{color:ov.c}}>{Math.round(res.overall.overall*100)}<span style={{fontSize:"0.5em"}}>%</span></div>
          <div className="meta">
            <div className="k">Análogo global · perfil {profile}</div>
            <div className="loc">{res.overall.site.name}</div>
            <div className="desc">lat {res.overall.site.lat}° · lon {res.overall.site.lon}° — lo más parecido a {pt.name} con todas las dimensiones juntas.</div>
          </div>
          <span className="verdict" style={{color:ov.c}}><span className="vd" style={{background:ov.c}}></span>{ov.t}</span>
        </div>

        <div className="grid">
          {DIMS.map(d=>{
            const p=res.perDim[d.key],v=verdict(p.score);
            return (
              <div className="card" key={d.key}
                   onMouseEnter={()=>setHover(d.key)} onMouseLeave={()=>setHover(null)}>
                <div className="top">
                  <span className="ic">{d.ic}</span><span className="nm">{d.name}</span>
                  <span className="verdict" style={{color:v.c}}><span className="vd" style={{background:v.c}}></span>{v.t}</span>
                </div>
                <div style={{display:"flex",justifyContent:"flex-end",marginBottom:4}}>
                  <span className="pct" style={{color:v.c}}>{Math.round(p.score*100)}%</span>
                </div>
                <div className="bar"><i style={{width:Math.round(p.score*100)+"%",background:d.color}}></i></div>
                <div className="rows">
                  <div><span className="k">mejor análogo</span><span className="site">{p.site.name}</span></div>
                  <div><span className="k">{pt.name}</span><span>{fmt(p.src,d.key)} {d.unit}</span></div>
                  <div><span className="k">Tierra</span><span>{fmt(p.match,d.key)} {d.unit}</span></div>
                  <div><span className="k">diferencia real</span><span>{fmt(p.diff,d.key)} {d.unit}</span></div>
                </div>
              </div>
            );
          })}
        </div>

        <div className="caveats">
          <b>Dónde se rompe la analogía — la Tierra no reproduce:</b>
          <ul>{CAVEATS.map((c,i)=><li key={i}>{c}</li>)}</ul>
        </div>
        <div className="foot">Analog Matcher · NASA Space Apps 2026 — datos de demostración.
          El motor de cercanía es el real; falta enchufar los DEM (LOLA · Copernicus · MOLA).</div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
